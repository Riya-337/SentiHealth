name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pip-audit
      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off || echo "::warning::pip-audit reported issues"
      - name: Tests
        run: python -m pytest -q tests
      - name: Simulated events + feature pipeline smoke test
        run: |
          python ml/simulate_events.py --days 1 --users 10 --seed 1 --out /tmp/ev.jsonl.gz
          python - <<'EOF'
          import sys; sys.path.insert(0, "ml")
          import pandas as pd
          from features import build_feature_table, FEATURE_NAMES
          F = build_feature_table(pd.read_json("/tmp/ev.jsonl.gz", lines=True, compression="gzip"))
          assert not F[FEATURE_NAMES].isna().any().any(); print("features ok", F.shape)
          EOF

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high || echo "::warning::npm audit reported issues"
      - run: npx tsc --noEmit -p .
      - run: npx vite build

  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check webapp/app.js
